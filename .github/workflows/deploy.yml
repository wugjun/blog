name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blog source
        # 将 checkout 从 v4 升级到 v6
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.BLOG_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --buildDrafts

      - name: Deploy to GitHub Pages
        # 将 actions-gh-pages 从 v4 升级到 v4 的最新版
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BLOG_ACCESS_TOKEN }}
          external_repository: wugjun/wugjun.github.io
          publish_branch: master
          publish_dir: ./public
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"