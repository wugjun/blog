<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>数字星夜 · 一年级数学 20 以内加减法 · Three.js 2D 几何游戏</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0e1f;font-family:"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #sceneWrap{position:fixed;inset:0;z-index:0}
  #sceneWrap canvas{display:block;touch-action:none}
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  #hudTopL{display:flex;gap:10px;align-items:center}
  .pill{background:rgba(10,14,31,.72);border:1px solid rgba(255,255,255,.22);color:#ffe9b8;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700;backdrop-filter:blur(4px)}
  .pill b{color:#ffd75e}
  /* ===== 奖励瓶罐（进制存储：个位铜、十位银、百位金、千位钻石） ===== */
  .jarGroup{display:inline-flex;align-items:center;gap:3px;background:rgba(10,14,31,.72);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:5px 8px;backdrop-filter:blur(4px)}
  .jarTag{display:inline-flex;flex-direction:column;align-items:center;gap:1px;margin-right:4px;font-size:11px;color:#ffe9b8;font-weight:700}
  .jarTag i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff3b0, #d4a017);border:1px solid #ffefb0}
  .jar{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:36px;border:2px solid rgba(255,255,255,.55);border-radius:7px 7px 12px 12px;background:rgba(255,255,255,.10);box-shadow:inset 0 -7px 0 rgba(255,255,255,.07);position:relative;transition:opacity .3s}
  .jar b{font-size:15px;color:#fff;line-height:1;z-index:1;font-weight:900}
  .jar .cap{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.35)}
  .jar .grain{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:10px;height:8px;border-radius:4px 4px 8px 8px;background:radial-gradient(circle at 50% 30%, #ffd9a0, #b87333);z-index:0;opacity:.9}
  .jar.empty{opacity:.30}
  .jar.empty .grain{display:none}
  .jar.pop b{animation:jarPop .5s cubic-bezier(.2,2.4,.4,1)}
  @keyframes jarPop{0%{transform:scale(1)}40%{transform:scale(1.7);color:#ffd75e}100%{transform:scale(1)}}
  .jarT{background:radial-gradient(circle at 50% 30%, #ffd9a0, #b87333)}
  .jarS{background:radial-gradient(circle at 50% 30%, #fff, #9aa4b1)}
  .jarG{background:radial-gradient(circle at 50% 30%, #fff3b0, #d4a017)}
  .jarD{background:radial-gradient(circle at 50% 30%, #dff6ff, #3ec1e8)}
  /* ===== 奖励飘动 ===== */
  .flyCoin,.flyStar{position:fixed;z-index:60;pointer-events:none;will-change:transform,opacity}
  .flyCoin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#3a2500;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 10px rgba(255,215,94,.7)}
  .flyCoin.copper{background:radial-gradient(circle at 35% 30%, #ffd9a0, #b87333);border-color:#ffd9a0}
  .flyCoin.silver{background:radial-gradient(circle at 35% 30%, #fff, #9aa4b1);border-color:#fff;color:#334}
  .flyCoin.gold{background:radial-gradient(circle at 35% 30%, #fff3b0, #d4a017);border-color:#ffefb0}
  .flyCoin.dia{background:radial-gradient(circle at 35% 30%, #dff6ff, #3ec1e8);border-color:#e6f7ff;color:#064}
  .flyStar{font-size:32px;line-height:1;color:#ffd75e;text-shadow:0 0 14px rgba(255,215,94,.95)}
  .score{color:#aef2c9}
  .score b{color:#8fe8b0}
  #backBtn{pointer-events:auto;background:#2f3b68;color:#fff;border:1px solid #5b6fc0;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer}
  #backBtn:hover{background:#3d4e9e}
  #statusLine{position:fixed;top:64px;left:0;right:0;z-index:20;text-align:center;pointer-events:none;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #formula{position:fixed;bottom:150px;left:0;right:0;z-index:20;text-align:center;pointer-events:none;font-size:26px;font-weight:800;color:#9ee6ff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  #toast{position:fixed;top:38%;left:0;right:0;z-index:30;text-align:center;pointer-events:none;font-size:34px;font-weight:900;color:#ffd75e;text-shadow:0 3px 12px rgba(0,0,0,.8);opacity:0;transition:opacity .35s}
  #toast.show{opacity:1}
  #gameUI{position:fixed;bottom:14px;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:8px 12px;pointer-events:none}
  #gameUI>*{pointer-events:auto}
  .gbtn{background:linear-gradient(#5b6fc0,#3d4e9e);color:#fff;border:2px solid #8fa2e8;border-radius:14px;padding:14px 20px;font-size:20px;font-weight:800;cursor:pointer;min-width:70px;box-shadow:0 4px 12px rgba(0,0,0,.4);touch-action:manipulation}
  .gbtn:hover{filter:brightness(1.15)}
  .gbtn:active{transform:translateY(2px)}
  .gbtn.gold{background:linear-gradient(#e8a33d,#c47e14);border-color:#ffd98a;color:#3a2500}
  .gbtn.red{background:linear-gradient(#d96a5a,#b3452f);border-color:#f0a08f}
  .gbtn.green{background:linear-gradient(#4fae6d,#2f8a4c);border-color:#8fd8a8}
  .gbtn.small{font-size:16px;padding:10px 14px;min-width:54px}
  .gbtn.tiny{font-size:14px;padding:8px 10px;min-width:44px;border-radius:10px}
  .gbtn:disabled{opacity:.4;pointer-events:none}
  .gmsg{background:rgba(10,14,31,.78);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:10px 18px;font-size:18px;font-weight:700;backdrop-filter:blur(4px)}
  .gmsg b{color:#ffd75e}
  .grow{flex-basis:100%;height:0}
  #fade{position:fixed;inset:0;background:#0a0e1f;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
  #fade.on{opacity:1;pointer-events:auto}
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.78);backdrop-filter:blur(6px)}
  .overlay.hidden{display:none}
  .card{background:linear-gradient(#232c55,#151d3d);border:2px solid #5b6fc0;border-radius:24px;padding:34px 44px;max-width:680px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .card h1{color:#ffd75e;font-size:40px;margin:0 0 6px;letter-spacing:2px}
  .card h2{color:#fff;font-size:22px;margin:0 0 16px;font-weight:600}
  .card p{color:#c7d2f5;font-size:16px;line-height:1.8;margin:4px 0}
  .card .sub{color:#8fa2e8;font-size:14px;line-height:1.7;margin:8px 0}
  .row{display:flex;justify-content:center;gap:12px;margin:18px 0 8px;flex-wrap:wrap}
  .lvlBtn{background:#2f3b68;color:#fff;border:2px solid #5b6fc0;border-radius:14px;padding:12px 22px;font-size:20px;font-weight:800;cursor:pointer;touch-action:manipulation}
  .lvlBtn.on{background:#e8a33d;border-color:#ffd98a;color:#3a2500}
  .bigBtn{background:linear-gradient(#e8a33d,#c47e14);color:#3a2500;border:none;border-radius:16px;padding:16px 40px;font-size:24px;font-weight:900;cursor:pointer;margin-top:8px;box-shadow:0 6px 18px rgba(0,0,0,.4);touch-action:manipulation}

  /* ===== 算式方框（数字格 + 加减符号 + 数字跳跃效果） ===== */
  .calcBox{display:inline-block;min-width:52px;padding:5px 12px;margin:0 2px;border:2px solid #5b6fc0;border-radius:12px;background:rgba(10,14,31,.88);color:#fff;font-size:26px;font-weight:900;text-align:center;vertical-align:middle;box-shadow:0 2px 0 rgba(0,0,0,.35) inset}
  .calcBox.sm{min-width:38px;padding:2px 9px;font-size:20px;border-radius:9px}
  .calcBox.gold{color:#ffd75e;border-color:#ffd98a}
  .calcBox.jump{animation:calcJump .55s cubic-bezier(.2,2.4,.4,1)}
  .calcOp{display:inline-block;min-width:46px;font-size:32px;font-weight:900;color:#ffd75e;text-align:center;vertical-align:middle;text-shadow:0 0 14px rgba(255,215,94,.55)}
  .calcEq{display:inline-block;min-width:34px;font-size:28px;font-weight:900;color:#9ee6ff;text-align:center;vertical-align:middle;text-shadow:0 0 10px rgba(158,230,255,.4)}
  @keyframes calcJump{
    0%{transform:translateY(0) scale(1)}
    35%{transform:translateY(-11px) scale(1.3);color:#ffd75e;border-color:#ffd98a;background:rgba(64,76,140,.9);box-shadow:0 0 20px rgba(255,217,138,.85)}

    100%{transform:translateY(0) scale(1)}
  }
  #ratingCard{position:relative}
  .closeX{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.12);color:#dfe6ff;border:1px solid rgba(255,255,255,.3);border-radius:50%;width:42px;height:42px;font-size:24px;line-height:1;cursor:pointer;z-index:2;touch-action:manipulation}
  .closeX:hover{background:rgba(255,255,255,.28);color:#fff}
  /* ===== 手机 / 窄屏适配 ===== */
  #backBtn{touch-action:manipulation}

    .card{padding:22px 18px;border-radius:18px;max-width:94vw;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}

    .card h2{font-size:18px;line-height:1.4;margin-bottom:12px}
    .card p{font-size:15px;line-height:1.7}
    .row{gap:10px;margin:14px 0 6px}
    .lvlBtn{padding:11px 16px;font-size:17px}
    .bigBtn{width:100%;max-width:320px;padding:16px 20px;font-size:21px}
    #hud{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
    .jarGroup{gap:2px;padding:4px 6px;border-radius:11px}
    .jar{width:24px;height:30px;border-radius:5px 5px 10px 10px}
    .jar b{font-size:12px}
    .jar .cap{width:12px;height:5px}
    .jar .grain{width:8px;height:6px}
    .jarTag{font-size:10px;margin-right:2px}
    .jarTag i{width:10px;height:10px}
    .flyCoin{width:20px;height:20px;font-size:10px}
    .flyStar{font-size:25px}
    .score{padding:4px 9px;font-size:14px}
    .pill{font-size:14px;padding:5px 11px}
    #backBtn{font-size:13px;padding:8px 10px;border-radius:9px}
    #statusLine{top:52px;font-size:17px;padding:0 8px}
    #formula{bottom:176px;font-size:22px;padding:0 8px}
    #toast{font-size:26px;top:32%}
    #gameUI{bottom:0;left:0;right:0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));gap:8px}
    .gbtn{min-width:0;flex:1 1 auto;padding:15px 10px;font-size:21px;border-radius:14px;max-width:160px}
    .gbtn.small{font-size:17px;padding:12px 8px;min-width:0}
    .gbtn.tiny{font-size:15px;padding:11px 6px;min-width:0}
    .gmsg{font-size:16px;padding:8px 12px}
    .stars{font-size:36px}
    #ratingCard .got{font-size:17px}
    .calcBox{min-width:42px;padding:4px 9px;font-size:22px;border-radius:10px}
    .calcBox.sm{min-width:32px;padding:1px 7px;font-size:17px}
    .calcOp{min-width:38px;font-size:26px}
    .calcEq{min-width:26px;font-size:23px}
    .closeX{width:38px;height:38px;font-size:21px}
  }
  @media (max-height: 520px) and (orientation: landscape){
    .card{max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 20px}
    .card h1{font-size:24px}
    .card h2{font-size:16px;margin-bottom:8px}
    .card p{font-size:14px;line-height:1.6}
    .bigBtn{padding:12px 24px;font-size:18px;width:auto}
    #gameUI{bottom:0;padding-bottom:6px;gap:6px}
    .gbtn{padding:10px 12px;font-size:16px;max-width:150px}
    #statusLine{top:48px;font-size:15px}
    #formula{bottom:88px;font-size:18px}
  }
</style>
</head>
<body>
<div id="sceneWrap"></div>

<div id="hud">
  <div id="hudTopL">
    <div class="jarGroup" id="coinJars" title="金币：个位铜、十位银、百位金、千位钻石">
      <span class="jarTag"><i></i>金币</span>
      <span class="jar" data-lv="3"><span class="cap"></span><span class="grain jarD"></span><b>0</b></span>
      <span class="jar" data-lv="2"><span class="cap"></span><span class="grain jarG"></span><b>0</b></span>
      <span class="jar" data-lv="1"><span class="cap"></span><span class="grain jarS"></span><b>0</b></span>
      <span class="jar" data-lv="0"><span class="cap"></span><span class="grain jarT"></span><b>0</b></span>
    </div>
    <div class="jarGroup" id="starJars" title="星星：个位铜、十位银、百位金、千位钻石">
      <span class="jarTag">★ 星星</span>
      <span class="jar" data-lv="3"><span class="cap"></span><span class="grain jarD"></span><b>0</b></span>
      <span class="jar" data-lv="2"><span class="cap"></span><span class="grain jarG"></span><b>0</b></span>
      <span class="jar" data-lv="1"><span class="cap"></span><span class="grain jarS"></span><b>0</b></span>
      <span class="jar" data-lv="0"><span class="cap"></span><span class="grain jarT"></span><b>0</b></span>
    </div>
    <div class="pill score" title="游戏局数：每玩一局 +1">局数 <b id="scoreVal">0</b></div>
  </div>
  <button id="backBtn" style="display:none">返回夜空</button>
</div>
<div id="statusLine"></div>
<div id="formula"></div>
<div id="gameUI"></div>
<div id="toast"></div>
<div id="fade"></div>

<div id="startScreen" class="overlay">
  <div class="card">
    <h1>数字星夜</h1>
    <h2>卖火柴的小女孩 · 数学大冒险（2D 几何版）</h2>
    <p>夜空里有六个发光的几何入口，每一个通向一个 2D 游戏：摘苹果、扶老奶奶过马路、爬楼梯、打靶、时钟救援、方阵寻宝。所有场景和实物都用圆形、三角形、矩形和线条拼成。</p>
    <p class="sub">数字是用来记录实物多少的：苹果个数、走过的步数、楼层高度、靶环数、时钟刻度、矩阵坐标。<br>每局按成绩获得 1–3 星和金币，全部计算过程都会当场显示。</p>
    <button id="startBtn" class="bigBtn">开始冒险</button>
    <div id="hintLine">建议使用 Chrome / Edge 打开 · 首次点击画面后音效开启 · 需要联网加载 three.js</div>
  </div>
</div>

<div id="introScreen" class="overlay hidden">
  <div class="card">
    <h2 id="introTitle">游戏</h2>
    <p id="introDesc"></p>
    <div class="row" id="lvlRow"></div>
    <button id="introGo" class="bigBtn">开始游戏</button>
  </div>
</div>

  <div class="card" id="ratingCard">
    <button id="closeRating" class="closeX" title="关闭并回到游戏">×</button>
    <h2 id="ratingTitle">完成！</h2>
    <div class="stars" id="ratingStars"></div>
    <div class="got" id="ratingGot"></div>
    <div class="row">
      <button id="againBtn" class="bigBtn">再玩一次</button>
      <button id="backWorldBtn" class="bigBtn" style="background:linear-gradient(#5b6fc0,#3d4e9e);color:#fff">返回夜空</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/DragControls.js"></script>
<script>
'use strict';
/* =========================================================
   数字星夜 · 一年级数学 20 以内加减法 · Three.js 2D 几何互动游戏
   单文件可运行版：2D 几何夜空世界 + 六场景游戏 + 星级金币
   场景与实物全部用圆形/三角形/矩形/线条等几何图形拼成
   ========================================================= */
try {
/* ---------------- 工具 ---------------- */
const $ = id => document.getElementById(id);
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function rand(a, b){ return a + Math.random() * (b - a); }
function randi(a, b){ return Math.floor(rand(a, b + 1)); }

/* 音效（WebAudio 程序化） */
let AC = null;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type, vol, delay){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol || 0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + (dur || 0.15) + 0.03);
}
const Sfx = {
  pick:  () => tone(620, .08, 'triangle', .14),
  drop:  () => tone(280, .10, 'sine', .15),
  coin:  () => { tone(880, .10, 'square', .10); tone(1320, .16, 'square', .10, .09); },
  win:   () => [523,659,784,1047].forEach((f,i)=>tone(f, .16, 'triangle', .18, i*.11)),
  fail:  () => [320,240,190].forEach((f,i)=>tone(f, .20, 'sawtooth', .09, i*.14)),
  click: () => tone(650, .05, 'square', .07),
  tick:  () => tone(760, .04, 'square', .06),
  laugh: () => { tone(500,.09,'triangle',.14); tone(680,.11,'triangle',.14,.10); },
  cry:   () => { tone(340,.28,'sine',.12); tone(290,.30,'sine',.12,.24); },
  whoosh:() => tone(220, .30, 'sawtooth', .06),
  meow:  () => { tone(820,.08,'triangle',.12); tone(980,.10,'triangle',.12,.08); },
  boom:  () => { tone(120,.35,'square',.12); tone(80,.4,'sine',.14,.02); },
};

/* 文字贴图 Sprite */
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function textSprite(text, o){
  o = Object.assign({ size: 64, color: '#ffffff', bg: null, border: null, pad: 14, weight: '800', unit: 1.2 }, o || {});
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = o.weight + ' ' + (o.size|0) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font = font;
  const tw = Math.ceil(ctx.measureText(text).width);
  const W = Math.ceil(tw + o.pad*2), H = Math.ceil(o.size*1.5 + o.pad*2);
  c.width = W; c.height = H; ctx.font = font;
  if (o.bg){ ctx.fillStyle = o.bg; roundRectPath(ctx, 1, 1, W-2, H-2, 14); ctx.fill(); }
  if (o.border){ ctx.strokeStyle = o.border; ctx.lineWidth = 3; roundRectPath(ctx, 2, 2, W-4, H-4, 13); ctx.stroke(); }
  ctx.fillStyle = o.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W/2, H/2 + 1);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const u = o.unit; sp.scale.set(W/H*u, u, 1);
  return sp;
}

/* 表情贴图（😊/😢/😴 手绘） */
function faceTex(mood){
  const c = document.createElement('canvas'); c.width = 128; c.height = 112;
  const x = c.getContext('2d');
  x.strokeStyle = '#2b2b3a'; x.fillStyle = '#2b2b3a'; x.lineWidth = 7; x.lineCap = 'round';
  if (mood === 'sleep'){ x.beginPath(); x.arc(42,46,9,0,Math.PI*2); x.fill(); x.beginPath(); x.arc(86,46,9,0,Math.PI*2); x.fill(); }
  else {

/* 简单补间动画 */
function tween(obj, props, dur, ease, onDone){
  const from = {}, to = {};
  for (const k in props){ from[k] = obj[k]; to[k] = props[k]; }
  const t0 = performance.now();
  function step(now){
    let t = clamp((now - t0) / (dur * 1000), 0, 1);
    t = ease ? ease(t) : t;
    for (const k in to) obj[k] = from[k] + (to[k] - from[k]) * t;
    if (t < 1) requestAnimationFrame(step); else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function minPresses(target, coins){
  if (target <= 0) return 0;
  const d = {0:0}; const q = [0];
  while (q.length){
    const v = q.shift();
    if (v === target) return d[v];
    for (const c of coins){
      const nv = v + c;
      if (nv < 0 || nv > target || d[nv] !== undefined) continue;
      d[nv] = d[v] + 1; q.push(nv);
    }
  }
  return Infinity;
}

/* ---------------- 2D 几何图形工厂 ---------------- */
/* 所有图形都画在 x-y 平面上（z=0），用平涂颜色，正交相机正看 */
function geo(shape, color, opt){
  opt = opt || {};
  return new THREE.Mesh(shape, new THREE.MeshBasicMaterial({
    color: color,
    transparent: !!opt.transparent,
    opacity: (opt.opacity !== undefined ? opt.opacity : 1),
    map: opt.map || null,
    side: opt.side || THREE.FrontSide
  }));
}
function rect(w, h, color, opt){ const m = geo(new THREE.PlaneGeometry(w, h), color, opt); return m; }
function circ(r, color, opt){ const m = geo(new THREE.CircleGeometry(r, 36), color, opt); return m; }
function ring(ir, or, color, opt){ const m = geo(new THREE.RingGeometry(ir, or, 44), color, opt); return m; }
function tri(w, h, color, opt){ // 底 w 高 h 的等腰三角形（尖端朝上，中心在形心附近）
  const s = new THREE.Shape();
  s.moveTo(-w/2, -h/2); s.lineTo(w/2, -h/2); s.lineTo(0, h/2); s.closePath();
  return geo(new THREE.ShapeGeometry(s), color, opt);
}
function lineSeg(x1, y1, x2, y2, color, th){
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(len, .01), th || .06), new THREE.MeshBasicMaterial({ color }));
  m.position.set((x1 + x2)/2, (y1 + y2)/2, 0);
  m.rotation.z = Math.atan2(dy, dx);
  return m;
}
function label(text, x, y, o){

/* 世界更新（2D） */
function updateWorld(dt, t){
  const spd = 2.2 * dt;
  if (girlKey.left){ girl.g.position.x -= spd; girl.g.scale.x = -1; girl.dir = -1; }
  else if (girlKey.right){ girl.g.position.x += spd; girl.g.scale.x = 1; girl.dir = 1; }
  else if (girlKey.up){ girl.g.position.y += spd; }
  else if (girlKey.down){ girl.g.position.y -= spd; }
  else {
    const target = Math.sin(t * .22) * Math.max(3, camHalfW - 1.5);
    girl.g.position.x += (target - girl.g.position.x) * Math.min(1, dt * .6);
    girl.g.scale.x = Math.cos(t * .22) >= 0 ? 1 : -1;
  }
  girl.g.position.x = clamp(girl.g.position.x, -(camHalfW - 1.2), camHalfW - 1.2);
  girl.g.position.y = clamp(girl.g.position.y, -7.5, -1.2);
  // 走路起伏 + 火苗闪动
  girl.g.position.y = clamp(girl.g.position.y, -7.5, -1.2) + Math.sin(t * 8) * .05;
  girl.fire.scale.setScalar(1 + Math.sin(t * 13) * .18);

function applePos(i){
  const lower = i < 8;
  const n = lower ? 8 : 7;
  const k = lower ? i : i - 8;
  const a = (k + (lower ? 0 : .5)) * Math.PI * 2 / n;
  // 苹果环中心对齐树冠中部（世界 y=-2.5），两环半径放大、彼此错开，露出绿色树冠
  const r = lower ? 1.62 : 1.45;
  return new THREE.Vector3(-4.2 + Math.cos(a) * r, -2.5 + Math.sin(a) * r * .95, 0);
}

  start(level, afterEnd){
    this.afterEnd = afterEnd;
    this.level = level;
    this.N = level === 1 ? randi(1,5) : randi(1,9);
    this.X = 0; this.retries = 0; this.locked = false; this.won = false;
    this.pickStep = level === 1 ? 1 : (level === 2 ? 2 : 3);
    this.onTree = this.apples.slice();
    this.panSlots = [];
    this.apples.forEach((a, i) => {
      a.userData.home = applePos(i); a.userData.slot = -1;
      a.visible = true; a.position.copy(a.userData.home);
      this.appleG.add(a);
    });
    this.weightNum.material.map = textSprite(String(this.N), { size: 88, color: '#6b3d00', unit: .5, pad: 0 }).material.map;
    this.weightNum.material.needsUpdate = true;
    this.tiltT = clamp((this.X - this.N) * .18, -.4, .4);
    this.bounceT = undefined;
    renderCalc(0, '＋', 0, 0, null);
    this.updateStatus();
    this.drag = new THREE.DragControls(this.apples, camera, renderer.domElement);
    const self = this;
    this.drag.addEventListener('dragstart', ev => {
      const a = ev.object;
      if (self.locked) return;
      if (a.parent !== self.appleG){
        const w = a.getWorldPosition(new THREE.Vector3());
        self.appleG.add(a); a.position.copy(w);
      }
      Sfx.pick();
    });
    this.drag.addEventListener('dragend', ev => {
      const a = ev.object;
      if (self.locked) return;
      if (self.onTree.includes(a)){
        const dx = a.position.x - self.panC.x, dy = a.position.y - self.panC.y;
        if (Math.hypot(dx, dy) < 1.9){
          Sfx.drop(); self.addToPan(a);
        } else {
          tween(a.position, a.userData.home, .25, easeOut);
        }
      } else {
        self.panL.add(a);
        a.position.copy(self.panSlotPos(a.userData.slot));
      }
    });
    this.dragEnabled = true;
    this.buildUI();
  },
  panSlotPos(slot){
    const c = slot % 3 - 1, zz = Math.floor(slot / 3);
    return new THREE.Vector3(c * .2, -.05 + zz * .26, 0);
  },
  dropIntoPan(a){
    const slot = this.panSlots.length;
    this.panSlots.push(a); a.userData.slot = slot;
    const tgt = this.panSlotPos(slot);
    const w = a.getWorldPosition(new THREE.Vector3());
    this.panL.add(a);
    a.position.copy(this.panL.worldToLocal(w));
    const self = this;
    tween(a.position, tgt, .24, easeInOut, () => { a.position.copy(tgt); self.updateStatus(); });
  },
  addToPan(a){
    this.onTree = this.onTree.filter(x => x !== a);
    const prev = this.X;
    this.dropIntoPan(a);
    this.X++;
    renderCalc(prev, '＋', 1, this.X, 'c');
    this.updateStatus();
  },
  pickGroup(n){
    if (this.locked) return;
    let taken = 0;
    for (const a of this.onTree.slice()){
      if (taken >= n) break;
      this.addToPan(a);
      taken++;
    }
    if (taken > 0){
      Sfx.drop();
    }
  },
  updateStatus(){
    const st = $('statusLine');
    const x = this.X, n = this.N;
    this.tiltT = clamp((x - n) * .18, -.4, .4);
    let word, color;
    if (x < n){ word = '苹果轻，再放几个'; color = '#ffd75e'; }
    else if (x > n){ word = '苹果太重了！'; color = '#ff8a7a'; }
    else { word = '平衡啦！'; color = '#8fe8b0'; }
    const jX = x !== this._lastX ? ' jump' : '';
    st.innerHTML = '左边托盘 <span class="calcBox sm' + jX + '">' + x + '</span> 个苹果 · 砝码 <span class="calcBox sm gold">' + n + '</span> — <b style="color:' + color + '">' + word + '</b>';
    this._lastX = x;
    this.balanceWord.material.map = textSprite(word, { size: 60, color: color, unit: 1.5, bg: 'rgba(10,14,31,.7)', pad: 10 }).material.map;
    this.balanceWord.material.needsUpdate = true;
    if (x === n && !this.won){ this.won = true; setTimeout(() => this.celebrate(), 450); }
    if (x > n && !this.locked){ this.locked = true; this.retries++; Sfx.fail(); toast('太重了！苹果比砝码重，重新开始'); setTimeout(() => this.restartPick(), 1300); }
  },
  restartPick(){
    for (const a of this.apples){
      this.appleG.add(a);
      a.visible = true;
      a.position.copy(a.userData.home);
    }
    this.panSlots = [];
    this.X = 0; this.locked = false; this.won = false;
    this.tiltT = clamp((0 - this.N) * .18, -.4, .4);
    renderCalc(0, '＋', 0, 0, null);
    this.updateStatus();
  },
  celebrate(){
    this.locked = true; Sfx.win();
    this.tiltT = 0; this.bounceT = 0;
    toast('平衡啦！' + this.N + ' 个苹果和砝码一样重，全对！');
    setTimeout(() => this.finishWin(), 1600);
  },
  finishWin(){
    this.locked = true;
    const stars = this.level;
    SAVE.stars += stars;
    if (!SAVE.best[0] || (SAVE.best[0][this.level-1] || 0) < stars){ (SAVE.best[0] = SAVE.best[0] || []); SAVE.best[0][this.level-1] = stars; }
    gainCoins(2 * this.level);  // 本局通过：按难度 ★+2 / ★★+4 / ★★★+6（结算时发放）
    persist();
    showRating('摘苹果', stars, 0, this.afterEnd);
  },
  buildUI(){
    clearUI();
    uiMsg('点“摘苹果”按钮，或直接拖动树上的苹果到左边托盘，直到天平平衡');
    for (let i = 1; i <= Math.max(1, this.pickStep); i++){
      uiBtn('摘 ' + i + ' 个', () => this.pickGroup(i), 'gold');
    }
  },
  update(dt, t){
    if (!this.fireflies) return;
    const p = this.fireflies.geo.attributes.position.array;
    for (let i = 0; i < this.fireflies.base.length; i += 3){
      p[i]   = this.fireflies.base[i]   + Math.sin(t * .55 + i) * .7;
      p[i+1] = this.fireflies.base[i+1] + Math.sin(t * .85 + i * 1.7) * .4;
    }
    this.fireflies.geo.attributes.position.needsUpdate = true;
    this.fireflies.mat.opacity = .55 + Math.sin(t * 2.2) * .25;
    // 天平：横梁倾斜 + 托盘高低（轻的一头翘起来）
    this.beam.rotation.z += (this.tiltT - this.beam.rotation.z) * Math.min(1, dt * 4.5);
    if (this.bounceT !== undefined){
      this.bounceT += dt;
      if (this.bounceT < 1.5){
        const k = Math.max(0, 1 - this.bounceT / 1.5);
        this.beam.rotation.z += Math.sin(this.bounceT * 11) * .06 * k;
      }
    }
    const th = this.beam.rotation.z, cosT = Math.cos(th), sinT = Math.sin(th);
    const arm = 1.75, px = 0, py = 3.0, panY = 2.05;
    this.panL.position.set(px - arm*cosT, py - arm*sinT, 0);
    this.panR.position.set(px + arm*cosT, py + arm*sinT, 0);
    this.chainL.position.set(px - arm*cosT, (py - arm*sinT) + .95, 0);
    this.chainR.position.set(px + arm*cosT, (py + arm*sinT) + .95, 0);
  },
  end(){ if (this.drag && this.drag.dispose) this.drag.dispose(); clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = ''; }
};

const stairGame = {

      }

      num.position.set(3.6, y + .55, -4.3); g.add(num);
    }
    // 小男孩（2D 火柴人：圆头 + 矩形身体 + 圆眼睛表情）
    const boy = new THREE.Group();
    const body = rect(.55, 1.0, 0x3f9bd9); body.position.y = .65; boy.add(body);
    const head = circ(.28, 0xffe0c0); head.position.y = 1.45; boy.add(head);
    const diaper = tri(.5, .3, 0xffffff); diaper.position.y = .15; boy.add(diaper);
    this.boyFace = new THREE.Sprite(new THREE.SpriteMaterial({ map: faceTex('happy'), transparent: true }));
    this.boyFace.scale.set(.85, .74, 1); this.boyFace.position.set(0, 1.48, .1); boy.add(this.boyFace);
    boy.position.set(0, -7.2, -4.2); g.add(boy);
    this.boy = boy;
    this.stairG = g;
  },
  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    this.errors = 0; this.locked = false; this.nVal = undefined;
    this.phase = 0;
    if (level === 3){
      this.F = randi(1, 3); this.a = randi(5, 9); this.mid = this.F + this.a;
      do { this.b = randi(1, 9); this.T = this.mid - this.b; } while (this.T < 1 || this.T > 9);
      this.phase = 1;
      this.showEq('F + a = ?', '第 1 步：填 a，让男孩从 ' + this.F + ' 层上升');
    } else {
      this.F = randi(1, level === 1 ? 4 : 8);
      if (level === 1){
        this.sign = '+'; this.T = randi(this.F + 1, Math.min(5, this.F + 3));
      } else {
        this.sign = Math.random() < .5 ? '+' : '-';
        if (this.sign === '+'){
          this.T = randi(this.F + 1, Math.min(9, this.F + 9));
        } else if (this.F >= 2){
          this.T = randi(1, this.F - 1);
        } else {
          this.sign = '+'; this.T = randi(this.F + 1, Math.min(9, this.F + 9));
        }
      }
      this.n = this.sign === '+' ? this.T - this.F : this.F - this.T;
      this.showEq('F ○ n = T', '男孩在 ' + this.F + ' 层，要到 ' + this.T + ' 层');
    }
    this.boy.position.set(0, -7.2 + (this.F - 1) * 1.6, -4.2);
    this.setFace('happy');
    this.updateInfo();
    this.buildUI();
  },
  showEq(tpl, hint){
    this.tpl = tpl; this.hintBase = hint;
  },
  updateInfo(){
    const st = $('statusLine');
    const nv = (this.nVal !== undefined && this.nVal !== null) ? this.nVal : '?';
    if (this.phase === 1){
      st.innerHTML = '第 1 步：<b style="color:#fff">' + this.F + ' ＋ <span id="nv">' + nv + '</span> ＝ ' + this.mid + '</b>';
    } else if (this.phase === 2){
      st.innerHTML = '第 2 步：<b style="color:#fff">' + this.mid + ' − <span id="nv">' + nv + '</span> ＝ ' + this.T + '</b>';
    } else {
      const op = this.sign === '+' ? '＋' : '−';
      st.innerHTML = '男孩在 <b style="color:#9ee6ff">' + this.F + '</b> 层 · 要到 <b style="color:#ffd75e">' + this.T + '</b> 层：<b>' + this.F + ' ' + op + ' <span id="nv">' + nv + '</span> ＝ ' + this.T + '</b>';
    }
  },
  setFace(mood){ this.boyFace.material.map = faceTex(mood); this.boyFace.material.needsUpdate = true; },
  setSign(s){ this.sign = s; this.updateInfo(); },
  setN(n){ this.nVal = n; const el = $('nv'); if (el) el.textContent = n; },
  go(){
    const n = this.nVal;
    if (n === undefined || n === null || n === '' ){ toast('请先输入数字'); return; }
    if (this.locked) return;
    if (this.phase === 1){
      if (this.F + n !== this.mid){ this.wrong(); return; }
      this.locked = true; Sfx.whoosh();
      tween(this.boy.position, { y: -7.2 + (this.mid - 1) * 1.6 }, .8, easeInOut, () => {
        this.phase = 2; this.locked = false; this.nVal = undefined;
        this.updateInfo(); this.buildUI();
      });
    } else if (this.phase === 2){
      if (this.mid - n !== this.T){ this.wrong(); return; }
      this.locked = true; Sfx.whoosh();
      tween(this.boy.position, { y: -7.2 + (this.T - 1) * 1.6 }, .8, easeInOut, () => this.win());
    } else {
      const ok = this.sign === '+' ? (this.F + n === this.T) : (this.F - n === this.T);
      if (!ok){ this.wrong(); return; }
      this.locked = true; Sfx.whoosh();
      tween(this.boy.position, { y: -7.2 + (this.T - 1) * 1.6 }, .8, easeInOut, () => this.win());
    }
  },
  wrong(){
    this.errors++; Sfx.cry(); this.setFace('cry');
    tween(this.boy.scale, { x: 1.15, y: .9, z: 1.15 }, .12, null, () => tween(this.boy.scale, { x: 1, y: 1, z: 1 }, .18, easeOut, () => this.setFace('happy')));
    if (this.errors >= 2){
      let hint;
      if (this.phase === 1) hint = '提示：a ＝ ' + (this.mid - this.F);
      else if (this.phase === 2) hint = '提示：b ＝ ' + (this.mid - this.T);
      else hint = this.sign === '+' ? ('提示：n ＝ T − F ＝ ' + (this.T - this.F)) : ('提示：n ＝ F − T ＝ ' + (this.F - this.T));
      toast(hint);
    }
    this.updateInfo();
  },
  win(){
    Sfx.laugh(); this.setFace('happy');
    const stars = this.level;
    SAVE.stars += stars;
    if ((SAVE.best[2][this.level-1] || 0) < stars) SAVE.best[2][this.level-1] = stars;
    gainCoins(2 * this.level);
    persist();
    showRating('帮小男孩爬楼梯', stars, 0, this.afterEnd);
  },
  buildUI(){
    clearUI();
    const row = document.createElement('div'); row.style.display = 'contents'; $('gameUI').appendChild(row);
    if (this.phase === 1 || (this.phase === 0 && this.level >= 2)){
      const plus = uiBtn('＋ 加', () => { this.setSign('+'); }, 'green small');
      const minus = uiBtn('− 减', () => { this.setSign('-'); }, 'red small');
    }
    for (let i = 0; i <= 9; i++) uiBtn(String(i), () => this.setN(i), 'tiny');
    uiBtn('清空', () => { this.nVal = undefined; const el = $('nv'); if (el) el.textContent = '?'; }, 'small');
    uiBtn('出发', () => this.go(), 'gold');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; }
};


/* ---------------- 游戏 4：打靶（2D 几何） ---------------- */
const shootG = makeGroup('shoot');
const shootGame = {
  init(){ const g = shootG;
    // 夜空背景
    const skyC = document.createElement('canvas'); skyC.width = 64; skyC.height = 256;
    const sk = skyC.getContext('2d');
    const grad = sk.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#0d1228'); grad.addColorStop(1, '#182038');
    sk.fillStyle = grad; sk.fillRect(0, 0, 64, 256);
    const skyTex = new THREE.CanvasTexture(skyC); skyTex.encoding = THREE.sRGBEncoding;
    const sky = geo(new THREE.PlaneGeometry(40, 22), 0xffffff, { map: skyTex });
    sky.position.z = -5; g.add(sky);
    // 地面（平铺整片）
    const ground = rect(40, 14, 0x10182e); ground.position.set(0, 0, -4.6); g.add(ground);
    // 地面圆形靶（俯视同心环：0 环=靶心金色，9 环=最外）
    this.target = new THREE.Group();
    const palette = [0xffd75e,0xffc05e,0xffa05e,0xff8a5a,0xff5a4d,0xd94a8a,0x8a5ad9,0x5b6fc0,0x3f9bd9,0x4fae6d];
    const RW = .32;
    for (let r = 0; r < 10; r++){
      const disc = circ((r + 1) * RW, palette[r]);
      disc.position.z = .01 * (r + 1);
      this.target.add(disc);
    }
    for (let r = 0; r < 10; r++){
      const mid = (r + .5) * RW;
      const num = textSprite(String(r), { size: 48, color: r === 0 ? '#6b4a00' : '#ffffff', unit: .3, pad: 0 });
      num.position.set(mid * Math.cos(-.6), mid * Math.sin(-.6), .16);
      this.target.add(num);
    }
    // 每环之间的轨道分隔线
    for (let r = 0; r <= 10; r++){
      const track = ring(r * RW, (r * RW + .025), 0xffffff, { transparent: true, opacity: .5, side: THREE.DoubleSide });
      track.position.z = .2;
      this.target.add(track);
    }
    this.target.position.z = -4.4; g.add(this.target);
    // 瓶盖（俯视：边缘 + 盖顶 + 高光）
    const cap = new THREE.Group();
    const edge = circ(.36, 0xb8862e); edge.position.z = .01; cap.add(edge);
    const top = circ(.3, 0xd9b06a); top.position.z = .02; cap.add(top);
    const shine = circ(.08, 0xffffff, { transparent: true, opacity: .9 }); shine.position.set(-.09, .09, .03); cap.add(shine);
    this.cap = cap; g.add(cap);
    // 目标线（力度＝距离的提示：靶心到起点连一条虚线示意 d）
    this.shootG = g;
  },
  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    this.round = 1; this.total = 0; this.locked = false; this.F = 0;
    this.newRound();
    this.buildUI();
  },
  newRound(){
    const Dmin = [3,5,7][this.level-1], Dmax = [5,8,9][this.level-1];
    this.D = randi(Dmin, Dmax);
    this.F = 0;
    this.target.position.set(-6.0 + this.D, 0, -4.4);
    this.cap.position.set(-6.0, 0, -4.3);
    this.cap.visible = true;
    const st = $('statusLine');
    st.innerHTML = '第 ' + this.round + ' / 3 发 · 距离 <b style="color:#9ee6ff">' + this.D + '</b> · 力度 <b style="color:#ffd75e" id="fv">0</b> · 总分 <b style="color:#8fe8b0">' + this.total + '</b>';
    $('formula').textContent = '滑动力度条设力度，发射瓶盖！力度 ＝ 距离 → 落 0 环靶心（最高分）';
    const slider = $('forceSlider');
    if (slider){ slider.value = 0; slider.max = 20; }
  },
  setForce(f){
    this.F = clamp(Math.round(f), 0, 20);
    const el = $('fv');
    if (el){
      el.textContent = this.F;
      el.style.display = 'inline-block';
      el.style.animation = 'none'; void el.offsetWidth;
      el.style.animation = 'calcJump .5s cubic-bezier(.2,2.4,.4,1)';
    }
    this.cap.position.x = -6.0 - this.F * .02;
    const slider = $('forceSlider'); if (slider) slider.value = this.F;
  },
  fire(){
    if (this.locked) return;
    this.locked = true; Sfx.whoosh();
    const diff = Math.abs(this.F - this.D);
    const ring = diff <= 9 ? diff : -1;  // -1 = 脱靶
    const tx = this.target.position.x;
    const endX = ring >= 0 ? tx + (this.F - this.D) * .32 : tx + (this.F - this.D > 0 ? 1 : -1) * 4.0;
    const fromX = this.cap.position.x;
    const t0 = performance.now(), dur = 800;
    const self = this;
    function step(now){
      let t = clamp((now - t0)/dur, 0, 1);
      const yy = easeOut(t);
      self.cap.position.set(fromX + (endX - fromX) * yy, 0, -4.3);
      if (t < 1) requestAnimationFrame(step);
      else self.resolve(ring, diff);
    }
    requestAnimationFrame(step);
  },
  resolve(ring, diff){
    const st = $('statusLine');
    if (ring < 0){
      st.innerHTML = '飞出去脱靶了！0 分 · 力度 ' + this.F + ' 差 ' + diff + '（要 ≤ 9 才落靶）';
      Sfx.fail();
    } else {
      const score = 10 - ring;
      this.total += score;
      Sfx.coin();
      st.innerHTML = '落点 <b style="color:#ffd75e">' + ring + ' 环</b> ＋' + score + ' 分 · 总分 <b style="color:#8fe8b0">' + this.total + '</b>';
      // 落点处大数字跳跃
      const nn = textSprite(String(ring), { size: 130, color: '#ffd75e', unit: .62, pad: 0 });
      nn.position.set(this.target.position.x + (this.F - this.D) * .32, 0, -4.2);
      nn.scale.set(.01, .01, .01);
      this.shootG.add(nn);
      tween(nn.scale, { x: 1, y: 1, z: 1 }, .45, easeOut);
      setTimeout(() => { nn.visible = false; }, 1500);
    }
    renderCalc(this.F, '−', this.D, diff, 'c');
    setTimeout(() => {
      if (this.round >= 3) this.finish();
      else { this.round++; this.newRound(); this.locked = false; }
    }, 1700);
  },
  finish(){
    const need = [18,21,24][this.level-1];
    if (this.total >= need){
      const stars = this.level;
      SAVE.stars += stars;
      if ((SAVE.best[3][this.level-1] || 0) < stars) SAVE.best[3][this.level-1] = stars;
      gainCoins(2 * this.level);
      persist();
      showRating('弹瓶盖', stars, 0, this.afterEnd, '总积分 ' + this.total + '（需 ≥ ' + need + '）');
    } else {
      Sfx.fail(); gainCoins(-1);
      this.locked = true;
      toast('总分 ' + this.total + ' 不够 ' + need + '，再来一次！');
      setTimeout(() => { this.start(this.level, this.afterEnd); }, 1600);
    }
  },
  buildUI(){
    clearUI();
    const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;align-items:center;gap:8px;background:rgba(10,14,31,.78);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 14px';
    const lab = document.createElement('span'); lab.style.cssText = 'font-size:16px;color:#fff;font-weight:700'; lab.textContent = '力度';
    const slider = document.createElement('input'); slider.type = 'range'; slider.min = 0; slider.max = 20; slider.value = 0; slider.id = 'forceSlider';
    slider.style.width = 'min(200px, 40vw)';
    slider.addEventListener('input', () => this.setForce(parseInt(slider.value, 10)));
    wrap.appendChild(lab); wrap.appendChild(slider);
    $('gameUI').appendChild(wrap);
    uiBtn('发射！', () => this.fire(), 'gold');
    uiMsg('滑动力度条弹射瓶盖！力度 − 距离 ＝ 落点环数，越接近 0 环分越高');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = ''; }
};

    this.eyeClL = rect(.1, .03, 0x2b2b3a); this.eyeClL.position.set(-.11, .43, .09); this.eyeClL.visible = false; this.kitten.add(this.eyeClL);
    this.eyeClR = rect(.1, .03, 0x2b2b3a); this.eyeClR.position.set(.11, .43, .09); this.eyeClR.visible = false; this.kitten.add(this.eyeClR);
    const m1 = lineSeg(-.07, .3, 0, .26, 0xd94a4a, .035); this.kitten.add(m1);

    this.kitten.position.set(0, -.15, .03); jar.add(this.kitten);
    // 圆形时钟：0 在最上，顺时针 1-9（刻度 + 数字 + 中心旋转的秒针）
    this.clockCX = 3.6; this.clockCY = 2.6;
    this.clockRing = ring(2.0, 2.18, 0x5b6fc0);
    this.clockRing.position.set(this.clockCX, this.clockCY, -4.3); g.add(this.clockRing);
    for (let i = 0; i < 10; i++){
      const a = Math.PI / 2 - i * Math.PI * 2 / 10;  // 0 在最上（12 点），1-9 顺时针排布
      const tick = lineSeg(this.clockCX + Math.cos(a) * 1.92, this.clockCY + Math.sin(a) * 1.92, this.clockCX + Math.cos(a) * 2.1, this.clockCY + Math.sin(a) * 2.1, 0xffffff, .06);

    this.handPivot = new THREE.Group();

    const handCap = circ(.12, 0xffd75e); handCap.position.z = .02; this.handPivot.add(handCap);

  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    // 越难倒计时越久（全部 >60 秒）：[75,90,120]；目标越大：[7,12,18]
    const cfg = [[7,75,[1,2]],[12,90,[1,2,5,-1,-2]],[18,120,[1,2,5,-1,-2,-3]]][level-1];
    this.V = randi(level === 1 ? 5 : (level === 2 ? 8 : 10), cfg[0]);
    this.airMax = cfg[1]; this.buttons = cfg[2];
    this.value = 0; this.presses = 0; this.locked = false; this.won = false;
    this.air = this.airMax;
    this.deadline = performance.now() + this.airMax * 1000;
    this.handPivot.rotation.z = 0;
    this.kitten.rotation.z = 0; this.kitten.position.set(0, -.15, .03); this.kitten.scale.set(1, 1, 1);
    this.eyeL.visible = this.eyeR.visible = true; this.eyeClL.visible = this.eyeClR.visible = false;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 1000);
    this.updateUI();
    this.buildUI();
  },
  tick(){
    if (this.locked) return;
    this.air = Math.max(0, Math.ceil((this.deadline - performance.now()) / 1000));
    this.updateUI();
    if (this.air <= 0 && this.value !== this.V){
      this.locked = true;
      setTimeout(() => this.fail(), 300);
    }
  },
  updateUI(){
    const ones = this.value % 10, tens = Math.floor(this.value / 10);
    $('statusLine').innerHTML =
      '目标 <b style="color:#ffd75e">' + this.V + '</b> · 时钟 <b style="color:#9ee6ff">' + tens + ' ' + ones + '</b> · 倒计时 <b style="color:#8fe8b0">' + this.air + ' 秒</b> · 按键 ' + this.presses + ' 次';
    // 秒针绕中心顺时针旋转：0 在最上（12 点位置）
    const a = (this.value % 10) / 10 * Math.PI * 2;
    this.handPivot.rotation.z = -a;
    const t = performance.now();
    this.kitten.scale.setScalar(1 + Math.sin(t / 400) * .02);
    for (let i = 0; i < this.bubbles.length; i++){
      const b = this.bubbles[i];
      b.position.y = -.55 + ((t / 1000) * .22 + i * .21) % 1 * 1.1;
    }
  },
  press(v){
    if (this.locked) return;
    const prev = this.value;
    this.value += v;
    if (this.value < 0) this.value = 0;
    this.presses++;  // 按键不消耗倒计时；拨动次数越少金币越多
    Sfx.tick();
    const carry = (this.value % 10) < (prev % 10) && this.value > prev;
    const borrow = (this.value % 10) > (prev % 10) && this.value < prev;
    $('formula').textContent = (v > 0 ? '+' : '') + v + ' → ' + prev + ' ' + (v >= 0 ? '＋' : '−') + Math.abs(v) + ' ＝ ' + this.value + (carry ? '（十位进 1）' : (borrow ? '（十位退 1）' : ''));
    if (carry){ Sfx.coin(); toast('进 1！'); }
    if (borrow){ Sfx.tick(); toast('退 1！'); }
    if (this.value === this.V){ this.locked = true; if (this.timer) clearInterval(this.timer); setTimeout(() => this.win(), 350); }
    this.updateUI();
  },
  win(){
    Sfx.meow(); Sfx.win();
    if (this.timer) clearInterval(this.timer);
    this.eyeL.visible = this.eyeR.visible = true; this.eyeClL.visible = this.eyeClR.visible = false;
    // 小猫成功跳出瓶子（上浮出瓶口 + 放大 + 开心）
    tween(this.kitten.position, { y: 1.45, x: 0 }, .6, easeOut);
    tween(this.kitten.scale, { x: 1.5, y: 1.5, z: 1.5 }, .5, easeOut);
    tween(this.kitten.rotation, { z: .12 }, .5, easeOut);
    const minAll = minPresses(this.V, this.buttons);
    const bonus = Math.max(0, minAll - this.presses + 1);  // 拨动秒针越少金币越多
    const coins = 2 * this.level + bonus;
    const stars = this.level;
    SAVE.stars += stars;
    if ((SAVE.best[4][this.level-1] || 0) < stars) SAVE.best[4][this.level-1] = stars;
    gainCoins(coins);
    persist();
    showRating('空气猫', stars, 0, this.afterEnd, '用了 ' + this.presses + ' 次按键（最优 ' + minAll + ' 次）');
  },
  fail(){
    Sfx.fail(); gainCoins(-1); toast('倒计时结束，小猫躺下了…再试一次！（金币 −1）');
    // 小猫在瓶内躺下 + 闭眼
    this.eyeL.visible = this.eyeR.visible = false; this.eyeClL.visible = this.eyeClR.visible = true;
    tween(this.kitten.rotation, { z: Math.PI / 2 }, .5, easeOut);
    setTimeout(() => {
      this.value = 0; this.air = this.airMax; this.presses = 0; this.locked = false;
      this.deadline = performance.now() + this.airMax * 1000;
      this.handPivot.rotation.z = 0;
      this.kitten.rotation.z = 0; this.kitten.position.set(0, -.15, .03); this.kitten.scale.set(1, 1, 1);
      this.eyeL.visible = this.eyeR.visible = true; this.eyeClL.visible = this.eyeClR.visible = false;
      if (this.timer) clearInterval(this.timer);
      this.timer = setInterval(() => this.tick(), 1000);
      this.updateUI();
    }, 1600);
  },
  buildUI(){
    clearUI();
    for (const v of this.buttons){
      const cls = v > 0 ? 'green' : 'red';
      uiBtn((v > 0 ? '+' : '') + v, () => this.press(v), cls + ' small');
    }
    uiMsg('小猫关在瓶子里：拨动秒针转到目标数（0 在最上），倒计时内救出它！');
  },
  end(){
    if (this.timer) clearInterval(this.timer);
    clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = '';
  }
};


/* ---------------- 游戏 6：毛毛虫回家（2D 几何） ---------------- */
/* 毛毛虫工厂：圆头 + 分段身体 + 眼睛 + 触角 */
function makeCaterpillar(color, s){
  const gp = new THREE.Group();
  const head = circ(.17, color); head.position.set(0, 0, .02); gp.add(head);
  for (let i = 1; i <= 3; i++){
    const seg = circ(.13, color); seg.position.set(-.16 * i, 0, .01); gp.add(seg);
  }
  const eyeL = circ(.03, 0x2b2b3a); eyeL.position.set(.07, .08, .06); gp.add(eyeL);
  const eyeR = circ(.03, 0x2b2b3a); eyeR.position.set(.07, -.08, .06); gp.add(eyeR);
  const antL = lineSeg(.08, .16, .14, .26, color, .03); gp.add(antL);
  const antR = lineSeg(.08, -.16, .14, -.26, color, .03); gp.add(antR);
  gp.scale.setScalar(s);
  return gp;
}
const matrixG = makeGroup('matrix');
const matrixGame = {
  init(){ const g = matrixG;
    // 夜空背景 + 网格区
    const skyC = document.createElement('canvas'); skyC.width = 64; skyC.height = 256;
    const sk = skyC.getContext('2d');
    const grad = sk.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#0b0f26'); grad.addColorStop(1, '#101830');
    sk.fillStyle = grad; sk.fillRect(0, 0, 64, 256);
    const skyTex = new THREE.CanvasTexture(skyC); skyTex.encoding = THREE.sRGBEncoding;
    const sky = geo(new THREE.PlaneGeometry(40, 22), 0xffffff, { map: skyTex });
    sky.position.z = -5; g.add(sky);
    const board = rect(10.2, 10.2, 0x1c2547); board.position.set(0, 0, -4.4); g.add(board);
    this.tiles = [];
    for (let r = 0; r < 10; r++){
      for (let c = 0; c < 10; c++){
        const tile = rect(.84, .84, 0x27335c);
        tile.position.set(c - 4.5, 4.5 - r, -4.3);
        g.add(tile); this.tiles.push(tile);
        const num = textSprite(String(r*10 + c), { size: 26, color: '#8fa2e8', unit: .4, pad: 0 });
        num.position.set(c - 4.5, 4.5 - r, -4.2); g.add(num);
      }
    }
    // 洞穴（家）：洞口拱 + 洞身，目标格上
    this.cave = new THREE.Group();
    const caveBody = rect(1.1, 1.1, 0x0c1020); caveBody.position.y = -.12; this.cave.add(caveBody);
    const arch = new THREE.Mesh(new THREE.CircleGeometry(.56, 24, Math.PI, Math.PI), new THREE.MeshBasicMaterial({ color: 0x0c1020 }));
    arch.position.y = .44; this.cave.add(arch);
    const rim = new THREE.Mesh(new THREE.CircleGeometry(.58, 24, Math.PI, Math.PI), new THREE.MeshBasicMaterial({ color: 0x5a3a22 }));
    rim.position.y = .46; rim.scale.set(1.08, 1.1, 1); this.cave.add(rim);
    this.cave.visible = false; g.add(this.cave);
    // 妈妈毛毛虫（大号，守在洞口）
    this.mama = makeCaterpillar(0x4fc95a, 1.25);
    this.mama.scale.x = -1.25;  // 面向洞口方向
    this.mama.visible = false; g.add(this.mama);
    // 小毛毛虫（玩家）
    this.player = makeCaterpillar(0x8fe06a, .72);
    g.add(this.player);
    // 白气（超步数失败时毛毛头顶冒气）
    this.steam = new THREE.Group();
    for (let i = 0; i < 3; i++){
      const p = circ(.1, 0xffffff, { transparent: true, opacity: .8 });
      p.position.set((i - 1) * .16, .18 + i * .1, .12);
      this.steam.add(p);
    }
    this.steam.visible = false; g.add(this.steam);
    // 爱心（相拥时显示）
    this.heart = new THREE.Group();
    const h1 = circ(.12, 0xff5a7a); h1.position.set(-.1, .08, 0); this.heart.add(h1);
    const h2 = circ(.12, 0xff5a7a); h2.position.set(.1, .08, 0); this.heart.add(h2);
    const h3 = tri(.26, .24, 0xff5a7a); h3.position.set(0, -.1, 0); this.heart.add(h3);
    this.heart.visible = false; g.add(this.heart);
    this.matrixG = g;
  },
  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    this.Smax = level === 1 ? 1 : (level === 2 ? 3 : 5);
    this.S = 1;
    this.steps = 0; this.locked = false; this.won = false;
    do {
      this.P = randi(0, 99);
      if (level === 1){
        const dir = Math.random() < .5;
        const step = randi(1, 9);
        if (dir) this.T = this.P + Math.min(step, 9 - this.P % 10);
        else this.T = this.P - Math.min(step, this.P % 10);
      } else {
        this.T = randi(0, 99);
      }
    } while (this.T === this.P);
    this.P0 = this.P;
    this.maxSteps = Math.floor(Math.abs(this.T - this.P0) / this.S) + 1;
    this.heart.visible = false;
    this.updateGrid();
    this.updateInfo();
    this.buildUI();
  },
  updateGrid(){
    const r = Math.floor(this.P / 10), c = this.P % 10;
    this.player.position.set(c - 4.5, 4.5 - r, -4.05);
    const tr = Math.floor(this.T / 10), tc = this.T % 10;
    this.cave.position.set(tc - 4.5, 4.5 - tr, -4.25);
    this.cave.visible = true;
    this.mama.position.set(tc - 4.5 + .34, 4.5 - tr, -4.1);
    this.mama.visible = true;
    this.heart.position.set(tc - 4.5, 4.5 - tr + .55, -4.0);
  },
  updateInfo(){
    $('statusLine').innerHTML =
      '洞穴入口 <b style="color:#ffd75e">' + this.T + '</b> · 毛毛在 <b style="color:#9ee6ff">' + this.P + '</b> · 步数 ' + this.steps + '/' + this.maxSteps + ' · 步长 ' + this.S;
  },
  move(dir){
    if (this.locked || this.won) return;
    const r = Math.floor(this.P / 10), c = this.P % 10;
    let np = this.P, label = '';
    if (dir === 'left'){ if (c - this.S < 0){ toast('到边上了，换个方向吧'); return; } np = this.P - this.S; label = this.P + ' − ' + this.S + ' ＝ ' + np; }
    else if (dir === 'right'){ if (c + this.S > 9){ toast('到边上了，换个方向吧'); return; } np = this.P + this.S; label = this.P + ' ＋ ' + this.S + ' ＝ ' + np; }
    else if (dir === 'up'){ if (r - this.S < 0){ toast('到边上了，换个方向吧'); return; } np = this.P - 10 * this.S; label = this.P + ' − ' + (10*this.S) + ' ＝ ' + np; }
    else if (dir === 'down'){ if (r + this.S > 9){ toast('到边上了，换个方向吧'); return; } np = this.P + 10 * this.S; label = this.P + ' ＋ ' + (10*this.S) + ' ＝ ' + np; }
    this.P = np; this.steps++;
    this.player.scale.x = (dir === 'left' || dir === 'up') ? -.72 : .72;
    Sfx.tick();
    this.updateGrid();
    $('formula').textContent = label;
    this.updateInfo();
    if (this.P === this.T){ this.won = true; this.locked = true; setTimeout(() => this.win(), 400); }
    else if (this.steps >= this.maxSteps){ setTimeout(() => this.fail('步数用完，超过最大步数 ' + this.maxSteps + ' 了！'), 300); }
  },
  fail(msg){
    if (this.locked || this.won) return;
    this.locked = true;
    Sfx.fail(); gainCoins(-1);
    // 毛毛躺平 + 头顶冒白气
    this.steam.position.set(this.player.position.x, this.player.position.y + .3, -4.0);
    this.steam.visible = true;
    tween(this.player.rotation, { z: Math.PI / 2 }, .4, easeOut);
    tween(this.player.scale, { y: .45 }, .4, easeOut);
    tween(this.steam.position, { y: this.player.position.y + 1.1 }, 1.0, easeOut);
    toast(msg + '（金币 −1）');
    setTimeout(() => {
      this.P = this.P0; this.steps = 0; this.locked = false;
      this.maxSteps = Math.floor(Math.abs(this.T - this.P0) / this.S) + 1;
      this.player.rotation.z = 0; this.player.scale.set(.72, .72, .72);
      this.steam.visible = false;
      this.updateGrid(); this.updateInfo();
    }, 1600);
  },
  win(){
    Sfx.win();
    const tr = Math.floor(this.T / 10), tc = this.T % 10;
    // 毛毛到家，和妈妈相拥：妈妈迎上来，小毛毛贴上去，爱心出现
    tween(this.mama.position, { x: tc - 4.5 - .14, y: 4.5 - tr }, .5, easeOut);
    tween(this.player.position, { x: tc - 4.5 + .16, y: 4.5 - tr }, .5, easeOut);
    this.heart.visible = true;
    tween(this.heart.scale, { x: 1.25, y: 1.25, z: 1.25 }, .4, easeOut);
    toast('毛毛回到家，和妈妈抱在一起啦！');
    const stars = this.level;
    SAVE.stars += stars;
    if ((SAVE.best[5][this.level-1] || 0) < stars) SAVE.best[5][this.level-1] = stars;
    gainCoins(2 * this.level);
    persist();
    showRating('毛毛虫回家', stars, 0, this.afterEnd, '用了 ' + this.steps + ' 步');
  },
  buildUI(){
    clearUI();
    uiBtn('← 左', () => this.move('left'), 'small');
    uiBtn('→ 右', () => this.move('right'), 'small');
    uiBtn('↑ 上', () => this.move('up'), 'small');
    uiBtn('↓ 下', () => this.move('down'), 'small');
    const row = document.createElement('div'); row.className = 'grow'; $('gameUI').appendChild(row);
    for (let s = 1; s <= this.Smax; s++) uiBtn('步长 ' + s, () => { this.S = s; this.maxSteps = Math.floor(Math.abs(this.T - this.P0) / this.S) + 1; this.updateInfo(); }, 'tiny');
    uiMsg('毛毛在 ' + this.P0 + '，洞穴入口在 ' + this.T + '：自由走，但超过最大步数 ' + this.maxSteps + ' 就失败。步长调小，最大步数会变多！');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = ''; this.cave.visible = false; this.mama.visible = false; this.heart.visible = false; }
};

  '滑动设力度弹瓶盖：力度 − 距离 ＝ 落点环数，差越小越靠近 0 环靶心。三次机会。',
  '用 ＋/− 按钮拨动秒针转到目标数。个位逢九进一、逢零退一。按键越少越好。',
  '毛毛虫要回家：0 在左上、99 在右下。步长不能大于到洞穴的差值，走过头会失败。'
];

let activeName = 'world';
let currentGame = -1, currentLevel = 1, pendingAfterEnd = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
}

/* UI 工具 */
function clearUI(){ $('gameUI').innerHTML = ''; }
function uiBtn(label, fn, cls){
  const b = document.createElement('button');
  b.className = 'gbtn ' + (cls || '');
  b.textContent = label;
  b.addEventListener('click', () => { audio(); Sfx.click(); fn(); });
  $('gameUI').appendChild(b);
  return b;
}
function uiMsg(html){
  const d = document.createElement('div');
  d.className = 'gmsg'; d.innerHTML = html;
  $('gameUI').appendChild(d);
  return d;
}
/* 算式方框行：[框A] 符号 [框B] = [框C]，跳动的数字格 */
function renderCalc(a, op, b, c, jumpKey){
  const j = k => k === jumpKey ? ' jump' : '';
  $('formula').innerHTML =
    '<span class="calcBox' + j('a') + '">' + a + '</span>' +
    '<span class="calcOp">' + op + '</span>' +
    '<span class="calcBox' + j('b') + '">' + b + '</span>' +
    '<span class="calcEq">=</span>' +
    '<span class="calcBox' + j('c') + '">' + c + '</span>';
}

/* 难度选择 + 开始 */
function showIntro(gameIdx, defLevel){
  currentGame = gameIdx - 1;
  $('introTitle').textContent = gameNames[currentGame];
  $('introDesc').innerHTML = gameDescs[currentGame] + '<br><span style="color:#ffd75e">最高记录：' + (maxBest(currentGame) || 0) + ' 星</span>';
  const row = $('lvlRow'); row.innerHTML = '';
  currentLevel = clamp(defLevel || 1, 1, 3);
  const btns = [];
  for (let l = 1; l <= 3; l++){
    const b = document.createElement('button');
    b.className = 'lvlBtn' + (l === currentLevel ? ' on' : '');
    b.textContent = '★'.repeat(l);
    b.addEventListener('click', () => {
      currentLevel = l;
      btns.forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      Sfx.click();
    });
    row.appendChild(b); btns.push(b);
  }
  $('introScreen').classList.remove('hidden');
}
$('introGo').addEventListener('click', () => {
  $('introScreen').classList.add('hidden');
  enterGame(currentGame, currentLevel);
});

function enterGame(idx, level){
  audio();
  SAVE.score = (SAVE.score || 0) + 1; persist(); refreshHud();  // 局数：每玩一次 +1
  fadeIn(() => {
    showOnly('world');
    groups['world'].visible = false;
    const keys = ['apple','cross','stair','shoot','clock','matrix'];
    groups[keys[idx]].visible = true;
    for (const k in groupLights) for (const l of groupLights[k]) l.visible = (k === keys[idx]);
    activeName = keys[idx];
    $('backBtn').style.display = 'inline-block';
    pendingAfterEnd = () => backToWorld();
    gameInstances[idx].start(level, pendingAfterEnd);
    fadeOut();
  });
}

function backToWorld(){
  if (currentGame >= 0 && gameInstances[currentGame].end) gameInstances[currentGame].end();
  currentGame = -1;
  fadeIn(() => {
    showOnly('world');
    activeName = 'world';
    $('backBtn').style.display = 'none';
    fadeOut();
  });
}

/* 结算 */
/* 结算（无弹窗）：场景内星级提示 + 再来一局按钮，星星奖励飘动到 HUD 瓶罐（金币已在操作中即时发放） */
function showRating(name, stars, coins, afterEnd, extra){
  clearUI();
  uiMsg('完成！' + name + ' ' + '★'.repeat(Math.max(0, stars)) + (extra ? ' · ' + extra : ''));
  uiBtn('再来一局', () => enterGame(currentGame >= 0 ? currentGame : 0, currentLevel), 'gold');
  audio(); Sfx.win();
  rewardFly(coins, stars, () => refreshHud());
}

/* 淡入淡出 */
function fadeIn(fn){ const f = $('fade'); f.classList.add('on'); setTimeout(() => { fn(); }, 260); }
function fadeOut(){ const f = $('fade'); f.classList.remove('on'); }

/* ---------------- 主循环 ---------------- */
fitCamera();
$('startBtn').addEventListener('click', () => {
  audio(); Sfx.win();
  $('startScreen').classList.add('hidden');
  refreshHud();
  toast('走向发光的几何入口，点击进入游戏');
});
$('backBtn').addEventListener('click', backToWorld);

/* 调试/测试句柄（对玩法无影响） */
window.__game = { groups, worldG, girl, camera, renderer, appleGame, crossGame, stairGame, shootGame, clockGame, matrixGame, showIntro, enterGame, backToWorld, maxBest, SAVE, refreshHud };
window.__state = { get active(){ return activeName; }, get currentGame(){ return currentGame; }, get level(){ return currentLevel; } };

const clock = new THREE.Clock();
let lastT = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, .05); lastT = now;
  const t = now / 1000;
  if (activeName === 'world') updateWorld(dt, t);
  else if (activeName === 'apple' && appleGame.update) appleGame.update(dt, t);
  renderer.render(scene, camera);
}

/* 初始化 */
(function boot(){
  appleGame.init(); crossGame.init(); stairGame.init(); shootGame.init(); clockGame.init(); matrixGame.init();
  groups['world'].visible = true;
  showOnly('world');
  refreshHud();
  animate();
})();
} catch(e){
  console.error(e);
  try { window.__bootMsg = (e && e.message) || String(e); } catch(_){}
  const s = document.getElementById('startScreen');
  if (s) s.innerHTML = '<div class="card"><h1>数字星夜加载失败了</h1><p>可能是网络问题导致 three.js 加载失败，请检查网络后刷新页面重试。</p></div>';
}

</script>
</body>
</html>
